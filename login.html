<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Training</title>
    <link rel="stylesheet" href="assets/styles/main.css">

</head>
<body>
    <div class="container">
        <div class="background"></div>

        <div class="auth_wrapper">
            <h1>Welcome Back</h1>
            <form onsubmit="login(event)" class="auth_form">
                <div style="display: flex; flex-direction: column;">
                    <label for="email">Email</label>
                    <input class="auth_input" type="email" id="email" name="email" required>
                </div>
                <div style="display: flex; flex-direction: column;">
                    <label for="password" id="password_label">Password</label>
                    <input class="auth_input" type="password" id="password" name="password" required>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 0.5rem;">
                    <a href="/">Forgot Password?</a>
                    <a href="/register.html">Create Account</a>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
<script src="scripts/auth.js"></script>
</html>
