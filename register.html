<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - My Training</title>
    <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body>
    <div class="container">
        <div class="background"></div>
        <div class="auth_wrapper">
            <h1>Create Account</h1>

            <div id="feedback" aria-live="polite"></div>

            <form id="registerForm" class="auth_form">
                <div style="display: flex; flex-direction: column;">
                    <label for="nom">Nom</label>
                    <input class="auth_input" type="text" id="nom" name="nom" required>
                </div>
                <div style="display: flex; flex-direction: column;">
                    <label for="prenom">Prenom</label>
                    <input class="auth_input" type="text" id="prenom" name="prenom" required>
                </div>
                <div style="display: flex; flex-direction: column;">
                    <label for="email">Email</label>
                    <input class="auth_input" type="email" id="email" name="email" required>
                </div>
                <div style="display: flex; flex-direction: column;">
                    <label for="cin">CIN</label>
                    <input class="auth_input" type="text" id="cin" name="cin" minlength="8" maxlength="8" required>
                </div>
                <div>
                    <label for="niveau">Niveau</label>
                    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem;">
                        <input type="radio" name="niveau" id="niveau1" value="L1">
                        <label for="niveau1">L1</label>
                        <input type="radio" name="niveau" id="niveau2" value="L2">
                        <label for="niveau2">L2</label>
                        <input type="radio" name="niveau" id="niveau3" value="L3">
                        <label for="niveau3">L3</label>
                        <input type="radio" name="niveau" id="niveau4" value="M1">
                        <label for="niveau4">M1</label>
                        <input type="radio" name="niveau" id="niveau5" value="M2">
                        <label for="niveau5">M2</label>
                    </div>
                </div>
                <div>
                    <label for="registerModules">Modules Disponibles</label>
                    <select name="modules" id="registerModules" multiple>
                        <option value="">Sélectionnez un module</option>      
                    </select>
                </div>
                <div style="display: flex; flex-direction: column;">
                    <label for="password">Password</label>
                    <input class="auth_input" type="password" id="password" name="password" minlength="8" required>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 0.5rem;">
                    <a href="login.html">Already have an account?</a>
                </div>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <script type="module" src="scripts/auth.js"></script>
</body>
</html>
