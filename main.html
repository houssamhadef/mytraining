<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Training - Modules</title>
    <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body>
    <div class="container">
        <div class="background"></div>
        <nav class="navbar">
            <div id="navbar_items" class="navbar_items">
                <h1>My Training</h1>
            </div>
        </nav>
        <div class="auth_wrapper" style="height:auto; min-height:calc(100vh - 64px); padding: 2rem 1rem;">
            <h1>My Training Modules</h1>

            

            <section class="auth_form main_panel">
                <div class="main_toolbar">
                    <div id="mainFeedback" aria-live="polite"></div>
                    <h1>Informations Personnelles</h1>
                    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:1rem;">
                        <div>
                            <label for="nom">Nom</label>
                            <input class="auth_input" type="text" id="nom" name="nom">
                        </div>
                        <div>
                            <label for="prenom">Prenom</label>
                            <input class="auth_input" type="text" id="prenom" name="prenom">
                        </div>
                        <div>
                            <label for="cin">Cin</label>
                            <input class="auth_input" type="text" id="cin" name="cin" disabled>
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input class="auth_input" type="text" id="email" name="email" disabled>
                        </div>
                    </div>

                    <h1>Choix de Modules</h1>
                    <label for="niveau">Niveau</label>
                    <div style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
                        <input type="radio" name="niveau" id="niveau1" value="L1">
                        <label for="niveau1">L1</label>
                        <input type="radio" name="niveau" id="niveau2" value="L2">
                        <label for="niveau2">L2</label>
                        <input type="radio" name="niveau" id="niveau3" value="L3">
                        <label for="niveau3">L3</label>
                        <input type="radio" name="niveau" id="niveau4" value="M1">
                        <label for="niveau4">M1</label>
                        <input type="radio" name="niveau" id="niveau5" value="M2">
                        <label for="niveau5">M2</label>
                    </div>

                    <label for="modules">Modules Disponibles</label>
                    <select name="modules" id="modules" multiple>
                        <option value="">Sélectionnez un module</option>
                    </select>

                    <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                        <button id="saveBtn" class="auth_form button">Update Profile</button>
                        <button id="logoutBtn" class="logout-btn">Logout</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="scripts/main.js"></script>
    <script type="module" src="scripts/modules.js"></script>
</body>
</html>
